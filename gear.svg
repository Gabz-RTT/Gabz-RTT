      <rect x="-7" y="-46" width="14" height="22" rx="3" transform="rotate(90)"/>
      <rect x="-7" y="-46" width="14" height="22" rx="3" transform="rotate(135)"/>
      <rect x="-7" y="-46" width="14" height="22" rx="3" transform="rotate(180)"/>
      <rect x="-7" y="-46" width="14" height="22" rx="3" transform="rotate(225)"/>
      <rect x="-7" y="-46" width="14" height="22" rx="3" transform="rotate(270)"/>
      <rect x="-7" y="-46" width="14" height="22" rx="3" transform="rotate(315)"/>
