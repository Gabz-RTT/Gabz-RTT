<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="-50 -50 100 100">
  <g fill="#6e7681">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <rect x="-7" y="-46" width="14" height="22" rx="3"/>
